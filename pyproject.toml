[project]
name = "rag-manuals"
version = "1.0.0"
description = "RAG over equipment manuals with hybrid retrieval, reranking, citations and a measured eval"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "tenacity>=8.5",
    "openai>=1.50",
    "anthropic>=0.40",
]

[project.optional-dependencies]
cohere = ["cohere>=5.11"]
local = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["rag*", "eval*"]

[tool.setuptools.package-data]
rag = ["static/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
