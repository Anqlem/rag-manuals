name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
      EMBEDDING_PROVIDER: fake
      EMBEDDING_DIM: "256"
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit and integration tests
        run: pytest -q
      - name: Smoke-run the eval harness on the sample manual
        run: |
          python -m rag reset
          python -m rag ingest data/sample
          python -m eval.run_eval retrieval --questions eval/questions.sample.jsonl --out eval/results/sample
          python -m eval.run_eval generation --questions eval/questions.sample.jsonl --out eval/results/sample
      - uses: actions/upload-artifact@v4
        with:
          name: eval-smoke-results
          path: eval/results/sample/*.md

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rag-manuals:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
